name: Pull Request Validation

on:
  pull_request:
    branches:
      - dev

permissions: read-all

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    outputs:
      c_format: ${{ steps.c_format.outputs.should_run }}
      c_static: ${{ steps.c_static.outputs.should_run }}
      termux_compile: ${{ steps.termux_compile.outputs.should_run }}
      update_harness: ${{ steps.update_harness.outputs.should_run }}
      build_package: ${{ steps.build_package.outputs.should_run }}
      installer_smoke: ${{ steps.installer_smoke.outputs.should_run }}
      go_check: ${{ steps.go_check.outputs.should_run }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧰 Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          checkout: false

      - name: C Format and Tidy Paths
        id: c_format
        run: .github/scripts/ci-should-run.py c-format

      - name: C Static Analysis Paths
        id: c_static
        run: .github/scripts/ci-should-run.py c-static

      - name: Strict Termux Clang Compile Paths
        id: termux_compile
        run: .github/scripts/ci-should-run.py termux-compile

      - name: Update Logic Harness Paths
        id: update_harness
        run: .github/scripts/ci-should-run.py update-harness

      - name: Termux Build and Package Paths
        id: build_package
        run: .github/scripts/ci-should-run.py build-package

      - name: Termux Installer Smoke Test Paths
        id: installer_smoke
        run: .github/scripts/ci-should-run.py installer-smoke

      - name: Provider Helper Paths
        id: go_check
        run: .github/scripts/ci-should-run.py go-check

  go-provider-helper:
    name: Provider Helper
    needs: changes
    if: ${{ needs.changes.outputs.go_check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: provider

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: provider/go.mod
          # The helper has no dependencies, so there is no go.sum to cache from.
          cache: false

      - name: Check Formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile for Android arm64
        run: |
          # Android refuses a non-PIE executable, so the type of the result is
          # part of what has to be checked.
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o /tmp/agy-provider ./cmd/agy-provider
          file /tmp/agy-provider
          readelf -h /tmp/agy-provider | grep -F 'DYN (Position-Independent Executable file)'

  update-harness:
    name: Update Logic
    needs: changes
    if: ${{ needs.changes.outputs.update_harness == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Drive the real update through a fake curl
        # Builds the bootstrapper for this runner and exercises the staging,
        # commit and rollback path, including how agy-provider is carried. The
        # fixture archive's members are scripts, so the host architecture does
        # not matter and nothing here reaches the network.
        run: ./scripts/update-harness.sh

  c-format-and-tidy:
    name: C Format and Tidy
    needs: changes
    if: ${{ needs.changes.outputs.c_format == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        clang
      exclude-paths: |
        .git
        ./.git
        bin
        ./bin
        staging
        ./staging
      commands: |
        set -Eeuo pipefail

        mapfile -t c_files < <(find lib -type f \( -name '*.c' -o -name '*.h' \) | sort)
        if (( ${#c_files[@]} == 0 )); then
          echo "No C source files found."
          exit 0
        fi

        clang-format --dry-run --Werror "${c_files[@]}"

        for source in "${c_files[@]}"; do
          [[ "$source" == *.c ]] || continue
          clang-tidy "$source" -- -std=gnu11
        done

  c-static-analysis:
    name: C Static Analysis
    needs: changes
    if: ${{ needs.changes.outputs.c_static == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        cppcheck
      exclude-paths: |
        .git
        ./.git
        bin
        ./bin
        staging
        ./staging
      commands: |
        set -Eeuo pipefail

        echo "Running cppcheck static analysis on C source files..."
        cppcheck \
          --enable=warning,performance,portability \
          --suppress=missingIncludeSystem \
          --error-exitcode=1 \
          lib/

  strict-termux-clang:
    name: Strict Termux Clang Compile
    needs: changes
    if: ${{ needs.changes.outputs.termux_compile == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        clang
      exclude-paths: |
        .git
        ./.git
        bin
        ./bin
        staging
        ./staging
      commands: |
        set -Eeuo pipefail

        echo "Verifying standalone C compilation under strict Termux Clang warning flags..."
        mkdir -p bin

        strict_flags=(
          -std=gnu11
          -Wall
          -Wextra
          -Wpedantic
          -Wshadow
          -Wformat=2
          -Wundef
          -Wcast-align
          -Werror
          -O2
        )

        clang "${strict_flags[@]}" -o "bin/agy-clang" lib/agy_helper.c

        for source in lib/*.c; do
          [[ -e "$source" ]] || continue
          [[ "$source" == "lib/agy_helper.c" ]] && continue

          base_name=$(basename "$source" .c)
          echo "Auxiliary C library detected: $source. Verifying shared-object compilation with clang..."
          clang "${strict_flags[@]}" -fPIC -shared -o "lib/lib${base_name}-clang.so" "$source" -ldl
        done

  build-and-package:
    name: Termux Build and Package
    needs: changes
    if: ${{ needs.changes.outputs.build_package == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        ca-certificates
        curl
        jq
        tar
        python
        clang
        golang
        glibc
        glibc-runner
        resolv-conf
      exclude-paths: |
        .git
        ./.git
        bin
        ./bin
        staging
        ./staging
      sync-back-paths: |
        antigravity-termux-standalone.tar.gz
      upload-artifact-name: antigravity-termux-standalone-preview
      env: |
        AGY_REQUIRE_PROVIDER=1
      commands: |
        set -Eeuo pipefail

        echo "Running build.sh builder integration test in Termux..."
        ./build.sh

        test -x bin/agy-provider

        echo "Packaging standalone release archive..."
        tar -czf antigravity-termux-standalone.tar.gz -C bin agy agy.va39 agy-provider

        if [[ ! -f antigravity-termux-standalone.tar.gz ]]; then
          echo "Error: Release archive antigravity-termux-standalone.tar.gz was not generated." >&2
          exit 1
        fi

        echo "Verifying archive contents..."
        tar -tf antigravity-termux-standalone.tar.gz

        tar -tzf antigravity-termux-standalone.tar.gz | grep -qE '^agy$' || (echo "Error: Missing agy in release archive!" && exit 1)
        tar -tzf antigravity-termux-standalone.tar.gz | grep -qE '^agy\.va39$' || (echo "Error: Missing agy.va39 in release archive!" && exit 1)
        tar -tzf antigravity-termux-standalone.tar.gz | grep -qE '^agy-provider$' || (echo "Error: Missing agy-provider in release archive!" && exit 1)

        echo "Verifying the provider helper runs on this device..."
        AGY_PROVIDER_HOME="$PWD/staging/provider-home" bin/agy-provider list | grep -F "No providers configured"

        echo "Archive validation passed successfully."

  installer-smoke:
    name: Termux Installer Smoke Test
    needs: changes
    if: ${{ needs.changes.outputs.installer_smoke == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        ca-certificates
        curl
        tar
        glibc
        glibc-runner
        resolv-conf
      exclude-paths: |
        .git
        ./.git
        bin
        ./bin
        staging
        ./staging
      commands: |
        set -Eeuo pipefail

        export TERMUX_VERSION="${TERMUX_VERSION:-ci}"

        fixture="$PREFIX/tmp/agy-installer-fixture"
        payload="$fixture/payload"
        archive="$fixture/antigravity-termux-standalone.tar.gz"
        rm -rf "$fixture"
        mkdir -p "$payload"

        cat > "$payload/agy" <<'FIXTURE'
        #!/usr/bin/env sh
        case "${1:-}" in
          --version)
            echo "v0.0.0-ci"
            ;;
          --help)
            echo "agy fixture help"
            ;;
          *)
            echo "agy fixture"
            ;;
        esac
        FIXTURE
        chmod 0755 "$payload/agy"
        cp "$payload/agy" "$payload/agy.va39"

        tar -czf "$archive" -C "$payload" agy agy.va39

        AGY_INSTALL_URL="file://$archive" \
        AGY_INSTALL_SKIP_LAUNCH=1 \
          bash ./install.sh

        test -x "$PREFIX/bin/agy"
        test -x "$PREFIX/bin/agy.va39"
        "$PREFIX/bin/agy" --version | grep -qx "v0.0.0-ci"
        "$PREFIX/bin/agy" --help | grep -q "agy fixture help"

        # An archive built before the provider helper existed must still install.
        test ! -e "$PREFIX/bin/agy-provider"

        # And one that carries it must install and verify it.
        cat > "$payload/agy-provider" <<'FIXTURE'
        #!/usr/bin/env sh
        case "${1:-}" in
          --version) echo "dev" ;;
          *) echo "agy-provider fixture" ;;
        esac
        FIXTURE
        chmod 0755 "$payload/agy-provider"
        tar -czf "$archive" -C "$payload" agy agy.va39 agy-provider

        AGY_INSTALL_URL="file://$archive" \
        AGY_INSTALL_SKIP_LAUNCH=1 \
          bash ./install.sh

        test -x "$PREFIX/bin/agy-provider"
        "$PREFIX/bin/agy-provider" --version | grep -qx "dev"
